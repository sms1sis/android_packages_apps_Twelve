name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0'
      version_code:
        description: 'Version Code'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated to v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4 # Updated to v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Build with Gradle
        shell: bash
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName=${{ inputs.version_name }} \
            -PversionCode=${{ inputs.version_code }}

      - name: Sign, Align, and Rename APK
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Decode the Base64 Keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          
          # 2. Locate Android SDK Build Tools
          BUILD_TOOLS_VERSION=$(ls -1 $ANDROID_HOME/build-tools | sort -rn | head -1)
          ZIPALIGN=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          
          # 3. Locate unsigned APK generated by Gradle
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          SIGNED_APK="app/build/outputs/apk/release/Twelve-v${{ inputs.version_name }}.apk"
          
          # 4. Zipalign the APK (Required before signing)
          $ZIPALIGN -p -f -v 4 "$UNSIGNED_APK" "$SIGNED_APK"
          
          # 5. Sign the APK natively
          $APKSIGNER sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$SIGNED_APK"
            
          # 6. Safely output the path for the release step using GITHUB_OUTPUT
          echo "signedReleaseFile=$SIGNED_APK" >> $GITHUB_OUTPUT
          
          # 7. Clean up security file
          rm keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
