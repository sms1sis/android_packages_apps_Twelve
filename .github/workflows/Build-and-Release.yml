name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

      version_name:
        description: "Version Name"
        required: true
        default: "1.0"

      version_code:
        description: "Version Code"
        required: true
        default: "1"

jobs:
  build:
    name: Build and Release Android App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleRelease bundleRelease \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}"

      - name: Sign, Align, and Rename APK
        id: sign_app
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="keystore.jks"
          RELEASE_DIR="app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"
          SIGNED_APK="$RELEASE_DIR/Twelve-v${{ inputs.version_name }}.apk"

          # Always remove the temporary keystore when the script exits.
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          # Decode signing keystore.
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          # Find the latest Android SDK Build Tools version.
          BUILD_TOOLS_VERSION=$(
            ls -1 "$ANDROID_HOME/build-tools" |
            sort -V |
            tail -n 1
          )

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"

          # Make sure the expected unsigned APK exists.
          if [[ ! -f "$UNSIGNED_APK" ]]; then
            echo "ERROR: Unsigned APK not found:"
            echo "$UNSIGNED_APK"
            echo ""
            echo "Available APK files:"
            find "$RELEASE_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          # Align APK before signing.
          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            "$SIGNED_APK"

          # Sign APK.
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$SIGNED_APK"

          # Verify APK signature.
          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          # Pass signed APK path to the release step.
          echo "signedReleaseFile=$SIGNED_APK" >> "$GITHUB_OUTPUT"

          echo "Signed APK:"
          echo "$SIGNED_APK"

      - name: Verify AAB exists
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$AAB" ]]; then
            echo "ERROR: Release AAB not found:"
            echo "$AAB"
            echo ""
            echo "Available AAB files:"
            find app/build/outputs/bundle/release \
              -type f \
              -name "*.aab" \
              -print || true
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
